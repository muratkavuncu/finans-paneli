name: Paneli yayınla

# Piyasa verisini ve haberleri toplar, paneli GitHub Pages'e koyar.
# Kod her değiştiğinde ve 10 dakikada bir çalışır.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE: https://muratkavuncu.github.io/finans-paneli/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Önce fiyatlar: haber puanlaması piyasa tepkisini bu dosyadan ölçer
      - name: Hisse ve endeks verisini topla
        env:
          PREV_MARKETS_URL: ${{ env.SITE }}/markets.json
        run: |
          python3 scripts/fetch_markets.py data/markets.json || {
            echo "Hisse verisi alınamadı, önceki veri korunuyor"
            mkdir -p data
            curl -fsS "$PREV_MARKETS_URL" -o data/markets.json || echo '{"updated":0,"symbols":{},"errors":["hepsi"]}' > data/markets.json
          }

      - name: Haberleri, takvimi ve olay puanlarını hazırla
        env:
          PREV_URL: ${{ env.SITE }}/news.json
        run: |
          python3 scripts/fetch_news.py data/news.json || {
            echo "Toplama başarısız, önceki haberler korunuyor"
            curl -fsS "$PREV_URL" -o data/news.json || echo '{"updated":0,"items":[],"events":[],"calendar":[],"errors":["hepsi"]}' > data/news.json
          }
          # Olay kaydı kaybolmasın: yeni dosya yoksa eskisini taşı
          test -s data/events_log.json || curl -fsS "$SITE/events_log.json" -o data/events_log.json || echo '[]' > data/events_log.json

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js _site/
          cp data/news.json data/markets.json data/events_log.json _site/data/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
