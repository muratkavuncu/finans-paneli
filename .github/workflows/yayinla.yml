name: Paneli yayınla

# Piyasa verisini ve haberleri toplar, paneli GitHub Pages'e koyar.
# Kod her değiştiğinde çalışır; ayrıca "zincir" işi her turdan sonra bir sonrakini başlatır (yaklaşık 3 dakikada bir).
# Zincir beklerken fiyatı 20 saniyede bir izler ve sert harekette hemen bildirim gönderir.
# GitHub'ın kendi zamanlayıcısı güvenilir olmadığı için yalnızca yedek: zincir koparsa onu yeniden başlatır.
# Zinciri durdurmak için depo değişkeni ZINCIR=kapali yapılır.
on:
  push:
    branches: [main]
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      deneme:
        description: Telefona deneme bildirimi gönder
        type: boolean
        default: false
      zincir:
        description: Bu turdan sonra bir sonrakini kendiliğinden başlat
        type: boolean
        default: false
      fiyat:
        description: Zincirin kendi kullandığı alan (son fiyat ve seviye bildirimlerinin zamanı); boş bırakın
        type: string
        default: ""

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://muratkavuncu.github.io/finans-paneli/
    env:
      SITE: https://muratkavuncu.github.io/finans-paneli/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bildirim durumu ve olay kaydı yayından bağımsız olarak önbellekte de tutulur:
      # yayın takılırsa aynı bildirimler tekrar tekrar gitmesin.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      # Önce fiyatlar: haber puanlaması piyasa tepkisini bu dosyadan ölçer
      - name: Hisse ve endeks verisini topla
        env:
          PREV_MARKETS_URL: ${{ env.SITE }}/markets.json
        run: |
          python3 scripts/fetch_markets.py data/markets.json || {
            echo "Hisse verisi alınamadı, önceki veri korunuyor"
            mkdir -p data
            curl -fsS "$PREV_MARKETS_URL" -o data/markets.json || echo '{"updated":0,"symbols":{},"errors":["hepsi"]}' > data/markets.json
          }

      - name: Haberleri, takvimi ve olay puanlarını hazırla
        env:
          PREV_URL: ${{ env.SITE }}/news.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.deneme }}
          STATE_DIR: state
          PRICE_SENT: ${{ inputs.fiyat }}
        run: |
          python3 scripts/fetch_news.py data/news.json || {
            echo "Toplama başarısız, önceki haberler korunuyor"
            curl -fsS "$PREV_URL" -o data/news.json || echo '{"updated":0,"items":[],"events":[],"calendar":[],"errors":["hepsi"]}' > data/news.json
          }
          # Olay kaydı kaybolmasın: yeni dosya yoksa eskisini taşı
          test -s data/events_log.json || curl -fsS "$SITE/events_log.json" -o data/events_log.json || echo '[]' > data/events_log.json
          test -s data/notify_state.json || curl -fsS "$SITE/notify_state.json" -o data/notify_state.json || echo '{"sent":{}}' > data/notify_state.json

      - name: AI sekmesi verisini topla
        env:
          PREV_AI_URL: ${{ env.SITE }}/ai.json
        run: |
          python3 scripts/fetch_ai.py data/ai.json || echo "AI verisi alınamadı"
          test -s data/ai.json || curl -fsS "$PREV_AI_URL" -o data/ai.json || echo '{"updated":0}' > data/ai.json

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site/data
          cp data/ai.json _site/data/
          cp index.html style.css app.js _site/
          test -s data/daily.json || curl -fsS "$SITE/daily.json" -o data/daily.json || echo '{"updated":0,"symbols":{}}' > data/daily.json
          cp data/daily.json _site/data/
          cp data/news.json data/markets.json data/events_log.json data/notify_state.json _site/data/
          mkdir -p state
          cp data/events_log.json data/notify_state.json state/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # Her dağıtıma benzersiz sürüm kimliği verilir; hazır eylem commit SHA'sını kullandığı için
      # aynı commit'le yapılan dağıtımlar bir süre sonra sessizce uygulanmıyordu (bkz. scripts/deploy_pages.py).
      - id: dagit
        name: Pages'e dağıt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REAL_SHA: "1"
        run: python3 scripts/deploy_pages.py deploy "${{ steps.artifact.outputs.artifact_id }}"
      - name: Yedek dağıtım (hazır eylem)
        if: steps.dagit.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Yayının güncellendiğini doğrula
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/deploy_pages.py verify data/news.json "$SITE/news.json" state

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

  # Bir sonraki turu başlatır. Aynı anda tek zincir yaşar: yeni başlayan, bekleyen eskisini iptal eder.
  zincir:
    needs: yayinla
    if: ${{ always() && vars.ZINCIR != 'kapali' && (github.event_name == 'schedule' || inputs.zincir) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    concurrency:
      group: zincir
      cancel-in-progress: true
    env:
      BEKLE: 140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: state-${{ github.run_id }}-izleyici
          restore-keys: state-
      - name: Beklerken fiyatı izle, sonra bir sonraki turu başlat
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_DIR: state
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE: https://muratkavuncu.github.io/finans-paneli/data
        run: |
          BASLA=$(date +%s)
          FIYAT=$(python3 scripts/watch_prices.py "$BEKLE" 20 || true)
          # İzleyici erken biterse zincir hızlanmasın: kalan süreyi bekle
          KALAN=$(( BEKLE - $(date +%s) + BASLA ))
          if [ "$KALAN" -gt 0 ]; then sleep "$KALAN"; fi
          case "$FIYAT" in *[!A-Za-z0-9:,=]*) FIYAT="" ;; esac
          gh workflow run yayinla.yml --repo "$GITHUB_REPOSITORY" --ref main -f zincir=true -f fiyat="$FIYAT"
